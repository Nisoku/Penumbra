name: Linux system deps
description: Install system libraries required to build the Slint windowed app and rfd dialog on Linux CI.
inputs: {}
outputs: {}
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
          libx11-dev libx11-xcb-dev libxcb-icccm4-dev libxcursor-dev \
          libxi-dev libxrandr-dev libxfixes-dev libwayland-dev \
          libfontconfig1-dev libgtk-3-dev libegl1-mesa-dev xvfb
