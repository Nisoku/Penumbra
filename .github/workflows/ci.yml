name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-native:
    name: Clippy (native, candle)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.os }}
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - run: cargo clippy --all-targets --features candle -- -D warnings

  test:
    name: Test (workspace)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.os }}
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - run: cargo test --workspace

  test-candle:
    name: Test (candle)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.os }}
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - run: cargo test -p penumbra-tests --features candle

  clippy-wasm:
    name: Clippy (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: cargo clippy -p penumbra-ui --target wasm32-unknown-unknown -- -D warnings

  build-wasm:
    name: Build (wasm release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install wasm-bindgen-cli
        run: |
          bindgen=$(cargo metadata --format-version 1 | python3 -c '
            import sys, json
            meta = json.load(sys.stdin)
            for pkg in meta["packages"]:
                if pkg["name"] == "wasm-bindgen":
                    print(pkg["version"])
                    break
          ')
          cargo install wasm-bindgen-cli --version "$bindgen" --locked
      - name: Build UI (wasm release)
        run: cargo build --release --target wasm32-unknown-unknown -p penumbra-ui --features candle-wasm

      # wasm-bindgen binds the build output into a runnable pkg/ bundle.
      - name: Run wasm-bindgen
        run: |
          mkdir -p dist/pwa
          wasm-bindgen \
            --no-typescript \
            --target web \
            --out-dir dist/pwa \
            target/wasm32-unknown-unknown/release/penumbra_ui.wasm
      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: penumbra-wasm
          path: dist/pwa/
          if-no-files-found: error
