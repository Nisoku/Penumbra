[package]
name = "penumbra-web"
version.workspace = true
edition.workspace = true

[dependencies]
penumbra-core = { path = "../../crates/core" }
penumbra-notes = { path = "../../crates/notes" }
dioxus = { version = "0.7", features = ["web"] }
dioxus-web = "0.7"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
log.workspace = true
env_logger.workspace = true
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"