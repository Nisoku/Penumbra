[workspace]
members = [
    "crates/core",
    "crates/notes",
    "platforms/web",
    "platforms/desktop",
    "platforms/mobile",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Penumbra Team"]
license = "MIT"

[workspace.dependencies]
dioxus = { version = "0.7", features = ["web", "desktop"] }
dioxus-core = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1