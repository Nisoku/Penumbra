[workspace]
resolver = "2"
members = [
  "Build/crates/penumbra-core",
  "Build/crates/penumbra-events",
  "Build/crates/penumbra-graph",
  "Build/crates/penumbra-layout",
  "Build/crates/penumbra-embed",
  "Build/crates/penumbra-index",
  "Build/crates/penumbra-search",
  "Build/crates/penumbra-storage",
  "Build/crates/penumbra-markdown",
  "Build/crates/penumbra-sync",
  "Build/crates/penumbra-auto-link",
  "Build/crates/penumbra-app",
  "Build/ui/penumbra-ui",
  "Build/tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
thiserror = "2"
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
slint = "1.17"
slint-build = "1.17"
