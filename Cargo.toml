[workspace]
resolver = "2"
members = [
  "Build/crates/penumbra-core",
  "Build/crates/penumbra-events",
  "Build/crates/penumbra-graph",
  "Build/crates/penumbra-layout",
  "Build/crates/penumbra-embed",
  "Build/crates/penumbra-index",
  "Build/crates/penumbra-search",
  "Build/crates/penumbra-storage",
  "Build/crates/penumbra-markdown",
  "Build/crates/penumbra-sync",
  "Build/crates/penumbra-editor",
  "Build/crates/penumbra-auto-link",
  "Build/crates/penumbra-app",
  "Build/ui/penumbra-component",
  "Build/ui/penumbra-ui",
  "Build/tests",
]
exclude = ["vendor/slint"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["NellowTCS"]
documentation = "https://nisoku.org/Penumbra/docs"
keywords = ["penumbra", "editor", "slint"]
repository = "https://github.com/Nisoku/Penumbra"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
thiserror = "2"
futures = "0.3"
async-trait = "0.1"
web-time = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
edita-core = "0.2.1"

slint = { path = "vendor/slint/api/rs/slint" }
slint-build = { path = "vendor/slint/api/rs/build" }
slint-macros = { path = "vendor/slint/api/rs/macros" }
i-slint-core = { path = "vendor/slint/internal/core" }
i-slint-compiler = { path = "vendor/slint/internal/compiler" }
i-slint-common = { path = "vendor/slint/internal/common" }
i-slint-backend-selector = { path = "vendor/slint/internal/backends/selector" }
