[package]
name = "penumbra-canvas"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["web"]
web = ["dep:web-sys"]

[dependencies]
penumbra-core = { path = "../penumbra-core" }
penumbra-theme = { path = "../penumbra-theme" }
serde.workspace = true
serde_json.workspace = true
web-sys = { version = "0.3", optional = true, features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "Window", "Document", "Element"] }
wasm-bindgen = "0.2"
tracing.workspace = true
