[package]
name = "penumbra-embed"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
penumbra-core = { path = "../penumbra-core" }
async-trait.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Candle-based embedding (optional, heavy ML dependency)
candle-core = { version = "0.10.2", optional = true, default-features = false }
candle-nn = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
tokenizers = { version = "0.23.1", optional = true, default-features = false }

[features]
default = []
candle = [
  "candle-core",
  "candle-nn",
  "candle-transformers",
  "tokenizers",
  "tokenizers/fancy-regex",
]

candle-load = ["candle", "dep:reqwest"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", default-features = false, optional = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Cache",
  "CacheStorage",
  "Request",
  "RequestInit",
  "Response",
  "ResponseInit",
  "Window",
] }
