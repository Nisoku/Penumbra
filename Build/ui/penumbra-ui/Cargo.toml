[package]
name = "penumbra-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "penumbra"
path = "src/main.rs"

[dependencies]
slint.workspace = true
rfd = "0.17.2"
opfs = "0.2"
async-channel = "2"
tracing.workspace = true
serde_json.workspace = true
penumbra-app = { path = "../../crates/penumbra-app" }
penumbra-core = { path = "../../crates/penumbra-core" }
penumbra-storage = { path = "../../crates/penumbra-storage" }
penumbra-markdown = { path = "../../crates/penumbra-markdown" }
penumbra-embed = { path = "../../crates/penumbra-embed" }
penumbra-editor = { path = "../../crates/penumbra-editor" }
penumbra-layout = { path = "../../crates/penumbra-layout" }
penumbra-graph = { path = "../../crates/penumbra-graph" }

[features]
default = []
candle = ["penumbra-embed/candle"]
candle-load = ["penumbra-embed/candle-load"]
candle-wasm = ["candle-load"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1", features = ["macros", "sync", "time"] }
wasm-bindgen = { version = "0.2" }
wasm-bindgen-futures = "0.4"

[build-dependencies]
slint-build.workspace = true
