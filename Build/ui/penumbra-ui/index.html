<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Penumbra</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101423;
        }
        #canvas {
            display: block;
            outline: none;
            touch-action: none;
        }
    </style>
</head>
<body>
    <!-- data-slint-auto-resize-to-preferred stops Slint's winit backend from
         pinning the canvas to the window's preferred size at startup. -->
    <canvas id="canvas" data-slint-auto-resize-to-preferred="false"></canvas>
    <script type="module">
        import init from "./pkg/penumbra_ui.js";

        const canvas = document.getElementById("canvas");

        // referenced a blog post for this lolllll
        function fill() {
            const s = canvas.style;
            s.minWidth = s.width = s.maxWidth = "100%";
            s.minHeight = s.height = s.maxHeight = "100%";
        }
        fill();
        new ResizeObserver(fill).observe(document.body);

        init();
    </script>
</body>
</html>
