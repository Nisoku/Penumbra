[package]
name = "penumbra-tests"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
candle = ["penumbra-embed/candle", "dep:tokenizers", "dep:candle-core", "dep:candle-nn"]
candle-load = ["penumbra-embed/candle-load", "candle"]

[dependencies]
penumbra-core = { path = "../crates/penumbra-core" }
penumbra-graph = { path = "../crates/penumbra-graph" }
penumbra-layout = { path = "../crates/penumbra-layout" }
penumbra-events = { path = "../crates/penumbra-events" }
penumbra-embed = { path = "../crates/penumbra-embed" }
penumbra-index = { path = "../crates/penumbra-index" }
penumbra-search = { path = "../crates/penumbra-search" }
penumbra-storage = { path = "../crates/penumbra-storage" }
penumbra-app = { path = "../crates/penumbra-app" }
penumbra-markdown = { path = "../crates/penumbra-markdown" }
penumbra-auto-link = { path = "../crates/penumbra-auto-link" }
penumbra-editor = { path = "../crates/penumbra-editor" }
penumbra-sync = { path = "../crates/penumbra-sync" }
serde_json.workspace = true
uuid.workspace = true
futures.workspace = true
chrono.workspace = true
tempfile = "3"
opfs = "0.2"
tokio = { version = "1", features = ["rt", "macros"] }
async-channel = "2"
pollster = "0.4"
tokenizers = { version = "0.23.1", optional = true, default-features = false, features = ["fancy-regex"] }
candle-core = { version = "0.10.2", optional = true, default-features = false }
candle-nn = { version = "0.10.2", optional = true }
wiremock = "0.6"
